<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 | XLab by dmxsan.dev</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F5F6F2" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <script>
      (() => {
        try {
          const s = localStorage.getItem('dmxsan-theme');
          const t =
            s === 'dark' || s === 'light'
              ? s
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = t;
          const m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#0F1411' : '#F5F6F2');
        } catch {}
      })();
    </script>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="topbar">
      <div class="brand-lockup">
        <a href="/" class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="10" height="10" rx="1.8" fill="var(--nir)" />
            <rect x="27" y="2" width="10" height="10" rx="1.8" fill="var(--line)" />
            <rect x="52" y="2" width="10" height="10" rx="1.8" fill="var(--nir)" />
            <rect x="14.5" y="14.5" width="10" height="10" rx="1.8" fill="var(--nir)" />
            <rect x="39.5" y="14.5" width="10" height="10" rx="1.8" fill="var(--nir)" />
            <rect x="2" y="27" width="10" height="10" rx="1.8" fill="var(--line)" />
            <rect x="27" y="27" width="10" height="10" rx="1.8" fill="var(--nir)" />
            <rect x="52" y="27" width="10" height="10" rx="1.8" fill="var(--line)" />
            <rect x="14.5" y="39.5" width="10" height="10" rx="1.8" fill="var(--nir)" />
            <rect x="39.5" y="39.5" width="10" height="10" rx="1.8" fill="var(--nir)" />
            <rect x="2" y="52" width="10" height="10" rx="1.8" fill="var(--nir)" />
            <rect x="27" y="52" width="10" height="10" rx="1.8" fill="var(--line)" />
            <rect x="52" y="52" width="10" height="10" rx="1.8" fill="var(--nir)" />
          </svg>
          <span><span class="brand-x">X</span>Lab</span>
        </a>
        <span class="brand-by">
          by <a href="https://dmxsan.dev">dmxsan.dev</a>
        </span>
      </div>

      <div class="top-right">
        <a
          href="https://github.com/dmxsan"
          class="top-nav-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub ↗
        </a>
        <button
          type="button"
          class="theme-toggle"
          data-theme-toggle
          data-light-label="Light EO"
          data-dark-label="Dark Forest"
          aria-pressed="false"
          aria-label="Dark Forest palette"
          title="Switch palette to Dark Forest"
        >
          <svg
            class="theme-toggle-icon only-light"
            width="14"
            height="14"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="8" cy="8" r="3" />
            <path d="M8 1.5v1.3M8 13.2v1.3M1.5 8h1.3M13.2 8h1.3M3.4 3.4l.9.9M11.7 11.7l.9.9M12.6 3.4l-.9.9M4.3 11.7l-.9.9" />
          </svg>
          <svg
            class="theme-toggle-icon only-dark"
            width="14"
            height="14"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M13.4 9.7A5.5 5.5 0 0 1 6.3 2.6a5.5 5.5 0 1 0 7.1 7.1Z" />
          </svg>
          <span class="theme-toggle-labels">
            <span class="only-light">Light EO</span>
            <span class="only-dark">Dark Forest</span>
          </span>
        </button>
      </div>
    </header>

    <main id="main-content" class="not-found" tabindex="-1">
      <span class="not-found-code">404</span>
      <h1 class="page-h1">Page not found</h1>
      <p class="page-sub">
        This experiment path is not available on XLab. Return to the index or visit the main
        portfolio on dmxsan.dev.
      </p>
      <div class="head-actions">
        <a href="/" class="btn-primary">Back to XLab →</a>
        <a href="https://dmxsan.dev" class="btn-secondary">Open dmxsan.dev →</a>
      </div>
    </main>

    <footer class="foot">
      <span>XLab by dmxsan.dev</span>
      <div class="foot-links">
        <a href="https://dmxsan.dev">dmxsan.dev</a>
        <a href="https://github.com/dmxsan" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </footer>

    <script src="/assets/theme.js"></script>
  </body>
</html>
